name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  id-token: write # required for AWS OIDC federation
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  push-images:
    name: Build & push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      matrix:
        service: [scan, live, forms]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.ECR_REGISTRY }}/clinchec-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/clinchec-${{ matrix.service }}:latest

  deploy-ecs:
    name: Roll out to ECS — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: push-images
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      max-parallel: 1
      matrix:
        service: [scan, live, forms]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/taskdef-${{ matrix.service }}.json
          container-name: clinchec-${{ matrix.service }}
          image: ${{ env.ECR_REGISTRY }}/clinchec-${{ matrix.service }}:${{ needs.push-images.outputs.image_tag }}

      - name: Deploy service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: clinchec-${{ matrix.service }}
          cluster: clinchec-${{ inputs.environment || 'staging' }}
          wait-for-service-stability: true

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    needs: push-images
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_SCAN_API_URL: ${{ vars.NEXT_PUBLIC_SCAN_API_URL }}
          NEXT_PUBLIC_LIVE_API_URL: ${{ vars.NEXT_PUBLIC_LIVE_API_URL }}
          NEXT_PUBLIC_FORMS_API_URL: ${{ vars.NEXT_PUBLIC_FORMS_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Publish to Vercel
        run: npx vercel deploy --prebuilt --token "$VERCEL_TOKEN" --yes
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
