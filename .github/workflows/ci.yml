name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The dev auth bypass must be inert in a production build. This asserts
      # it at the environment level, independently of the unit test, so a
      # regression in the guard cannot ship unnoticed.
      - name: Assert dev auth bypass is refused in production
        env:
          NODE_ENV: production
          DEV_AUTH_BYPASS: 'true'
        run: |
          node --experimental-strip-types -e "
            const { isDevBypassEnabled, assertDevBypassAllowed } =
              await import('./apps/web/lib/dev-auth-guard.ts');
            if (isDevBypassEnabled()) {
              throw new Error('SECURITY: dev auth bypass reported as enabled under NODE_ENV=production');
            }
            let refused = false;
            try { assertDevBypassAllowed(); } catch { refused = true; }
            if (!refused) {
              throw new Error('SECURITY: dev auth bypass did not refuse under NODE_ENV=production');
            }
            console.log('OK: dev auth bypass is refused in production');
          "

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SCAN_API_URL: http://localhost:8001
          NEXT_PUBLIC_LIVE_API_URL: http://localhost:8002
          NEXT_PUBLIC_FORMS_API_URL: http://localhost:8003
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  services:
    name: Service — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [scan, live, forms]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Download spaCy model
        if: matrix.service == 'scan'
        run: python -m spacy download en_core_web_sm

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check app

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [web, services]
    strategy:
      matrix:
        service: [scan, live, forms]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: clinchec/${{ matrix.service }}:ci
